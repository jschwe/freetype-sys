[package]

name = "freetype-sys"
version = "0.23.0"
authors = ["Coeuvre <coeuvre@gmail.com>"]
links = "freetype"
build = "build.rs"
keywords = ["freetype", "ffi"]
description = "Low level binding for FreeType font library"
license = "MIT"
readme = "README.md"
repository = "https://github.com/PistonDevelopers/freetype-sys.git"
homepage = "https://github.com/PistonDevelopers/freetype-sys"
edition = "2018"

[features]
default = ["png"]
bundled = ["libpng-sys?/build"]
# To avoid breaking changes, we always select the build feature of libpng-sys
# (at least until the next major API bump)
png = ["libpng-sys", "libpng-sys/build"]

[dependencies]
libpng-sys = { version = "1.1.11", optional = true }

[build-dependencies]
cc = "1"
pkg-config = "0.3.11"
